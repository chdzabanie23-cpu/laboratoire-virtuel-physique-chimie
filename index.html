    interval, paragraph("Approche la borne basse, puis verse l’acide goutte à goutte jusqu’au vert. Dans cette simulation, une goutte vaut 0,05 mL."),
    reading,
    row(button("Verser jusqu’à " + formatVolume(bounds[0]), () => setVolume(bounds[0]), volume >= bounds[0], "secondary"),
      button("Verser une goutte (0,05 mL)", () => setVolume(v => v + 5), color !== "Bleu")),
    color === "Vert" && button("Valider le volume à l’équivalence", () => {setPrecise(volume);setStage("results");}),
    color === "Jaune" && b.jsxs(b.Fragment, {children:[paragraph("Le jaune indique un excès d’acide. Recommence le titrage précis."),button("Recommencer le titrage précis", resetPrecise, false, "secondary")]})
  ]});
  return b.jsxs(b.Fragment, {children:[
    paragraph("À l’équivalence, les ions H₃O⁺ et HO⁻ ont réagi dans les proportions 1:1."),
    paragraph("H₃O⁺ + HO⁻ → 2 H₂O"),
    paragraph("Volume de soude Vᵦ = 10,0 mL. Concentration de l’acide Cₐ = 0,100 mol/L. Volume d’acide à l’équivalence Vₑ = " + formatVolume(precise) + "."),
    paragraph("Calcule Cᵦ à partir de Cₐ × Vₑ = Cᵦ × Vᵦ. Utilise la même unité pour les deux volumes."),
    b.jsxs("form", {className:"titrage-form", onSubmit:event => {
      event.preventDefault();
      const normalized = answer.trim().replace(",", ".");
      const value = Number(normalized);
      const expected = ACID_CONCENTRATION * (precise / 100) / ALIQUOT;
      setFeedback(/^\d+(?:\.\d+)?$/.test(normalized) && Math.abs(value - expected) < 0.0005
        ? "Correct. La concentration de la solution de soude est de 0,126 mol/L."
        : "Réessaie. Multiplie 0,100 par le volume d’acide à l’équivalence, puis divise par 10,0.");
    }, children:[
      b.jsxs("label", {htmlFor:"concentration", children:["Concentration de la soude (mol/L)", b.jsx("input", {
        id:"concentration", inputMode:"decimal", required:true, value:answer,
        onChange:event => {setAnswer(event.target.value);setFeedback("");}
      })]}),
      b.jsx("button", {type:"submit", className:"primary", children:"Vérifier ma réponse"}),
      b.jsx("p", {role:"status", children:feedback})
    ]})
  ]});
}
